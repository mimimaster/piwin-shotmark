[package]
name = "piwin-shotmark"
version = "0.1.0"
description = "QQ-style screenshot tool: silent capture, region select, annotate, clipboard and pin windows"
authors = ["piwin"]
edition = "2021"
license = "MIT"
repository = "https://github.com/mimimaster/piwin-shotmark"
homepage = "https://github.com/mimimaster/piwin-shotmark"
readme = "../README.md"

[lib]
name = "piwin_shotmark_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: the overlay window sits above the menu bar.
# tray-icon: the app is tray-resident, there is no main window.
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-global-shortcut = "~2.3.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# PNG encoding for the Windows GDI capture path.
png = "0.18"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61.3", features = [
  "Foundation",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# xdg-desktop-portal Screenshot call.
dbus = "0.9"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSObject",
  "NSString",
  "NSURL",
  "NSData",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "libc",
  "NSImage",
  "NSPasteboard",
  "NSResponder",
  "NSRunningApplication",
  "NSWindow",
  "NSWorkspace",
] }

[profile.release]
# Stays "unwind": wry wraps WKURLSchemeTask callbacks in objc2 exception catch,
# which panics under panic = "abort".
panic = "unwind"
codegen-units = 1
lto = true
